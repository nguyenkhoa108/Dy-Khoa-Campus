<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6f1e7"/><stop offset=".45" stop-color="#f3eee3"/><stop offset="1" stop-color="#e3efe6"/></linearGradient>
<radialGradient id="glow" cx="70%" cy="45%" r="45%"><stop offset="0" stop-color="#fff9e8" stop-opacity=".95"/><stop offset="1" stop-color="#fff9e8" stop-opacity="0"/></radialGradient>
<linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6e2"/><stop offset=".25" stop-color="#ffffff"/><stop offset=".7" stop-color="#f4f6f4"/><stop offset="1" stop-color="#c9d3ce"/></linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a4a31"/><stop offset=".4" stop-color="#13704b"/><stop offset="1" stop-color="#063524"/></linearGradient>
<linearGradient id="lab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e5c3d"/><stop offset=".5" stop-color="#147a52"/><stop offset="1" stop-color="#0b4b32"/></linearGradient>
<linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d6b4"/><stop offset="1" stop-color="#cdb185"/></linearGradient>
<linearGradient id="curl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9eee9"/><stop offset="1" stop-color="#b9c4be"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#bfe0ff" stop-opacity=".15"/></linearGradient>
<linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8c7a8"/><stop offset="1" stop-color="#bba57f"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a251b" flood-opacity=".22"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a251b" flood-opacity=".25"/></filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .27 0 0 0 0 .2 0 0 0 .07 0"/></filter>
<clipPath id="lc"><rect x="1500" y="470" width="400" height="360" rx="10"/></clipPath>
</defs>
<rect width="2400" height="1200" fill="url(#bg)"/>
<rect width="2400" height="1200" fill="url(#glow)"/>
<rect width="2400" height="1200" filter="url(#noise)"/>
<!-- dotted grid hint -->
<g fill="#0e5c3d" opacity=".07"><circle cx="1180" cy="160" r="5"/><circle cx="1240" cy="160" r="5"/><circle cx="1300" cy="160" r="5"/><circle cx="1180" cy="220" r="5"/><circle cx="1240" cy="220" r="5"/><circle cx="1300" cy="220" r="5"/><circle cx="2220" cy="980" r="5"/><circle cx="2280" cy="980" r="5"/><circle cx="2220" cy="1040" r="5"/><circle cx="2280" cy="1040" r="5"/></g>
<!-- shelf -->
<rect x="1080" y="1010" width="1320" height="40" rx="8" fill="url(#shelf)"/><rect x="1080" y="1050" width="1320" height="150" fill="#cdb894" opacity=".55"/>
<!-- toothpaste tube -->
<g filter="url(#sh2)" transform="translate(1150 860) rotate(-8)"><path d="M0 40 h300 l40 -20 v80 l-40 -20 h-300 z" fill="#fbfbfb"/><rect x="-60" y="30" width="70" height="80" rx="10" fill="#a8264f"/><rect x="40" y="52" width="180" height="16" rx="8" fill="#3d7ea6"/><rect x="40" y="76" width="120" height="10" rx="5" fill="#c9d3ce"/></g>
<!-- soap bar -->
<g filter="url(#sh2)"><rect x="1150" y="930" width="240" height="90" rx="40" fill="#bfe3d2"/><rect x="1175" y="945" width="190" height="30" rx="15" fill="#e2f3ea"/><circle cx="1420" cy="900" r="22" fill="#ffffff" opacity=".8"/><circle cx="1455" cy="870" r="13" fill="#ffffff" opacity=".7"/><circle cx="1400" cy="855" r="9" fill="#ffffff" opacity=".7"/></g>
<!-- pedometer -->
<g filter="url(#sh2)" transform="translate(2040 860)"><rect width="190" height="150" rx="36" fill="#f0913a"/><rect x="22" y="22" width="146" height="76" rx="14" fill="#16261f"/><text x="95" y="74" font-family="Courier New,monospace" font-size="40" font-weight="700" fill="#d7f25c" text-anchor="middle">10000</text><circle cx="60" cy="122" r="12" fill="#fde2c4"/><circle cx="130" cy="122" r="12" fill="#fde2c4"/></g>
<!-- bottle -->
<g filter="url(#sh)">
<rect x="1520" y="250" width="360" height="90" rx="22" fill="url(#cap)"/>
<g fill="#063524" opacity=".45"><rect x="1545" y="262" width="10" height="66" rx="5"/><rect x="1580" y="262" width="10" height="66" rx="5"/><rect x="1615" y="262" width="10" height="66" rx="5"/><rect x="1650" y="262" width="10" height="66" rx="5"/><rect x="1685" y="262" width="10" height="66" rx="5"/><rect x="1720" y="262" width="10" height="66" rx="5"/><rect x="1755" y="262" width="10" height="66" rx="5"/><rect x="1790" y="262" width="10" height="66" rx="5"/><rect x="1825" y="262" width="10" height="66" rx="5"/></g>
<path d="M1540 340 h320 v40 c90 30 120 90 120 170 v380 c0 50 -40 80 -90 80 h-380 c-50 0 -90 -30 -90 -80 v-380 c0 -80 30 -140 120 -170 z" fill="url(#bottle)"/>
<rect x="1450" y="540" width="20" height="380" rx="10" fill="#ffffff" opacity=".85"/>
</g>
<!-- label: kraft truth underneath -->
<rect x="1500" y="470" width="400" height="360" rx="10" fill="url(#kraft)"/>
<g font-family="Georgia,serif" fill="#5c4321" text-anchor="end"><text x="1878" y="780" font-size="30" font-weight="700">Bằng chứng</text><text x="1878" y="818" font-size="26" font-style="italic">nói gì?</text></g>

<!-- green ad label (partially peeled) -->
<g clip-path="url(#lc)"><path d="M1500 470 h400 v80 l-280 280 h-120 z" fill="url(#lab)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#ffffff"><text x="1530" y="530" font-size="26" font-weight="800" letter-spacing="3" fill="#d7f25c">SIÊU MIỄN DỊCH</text><text x="1530" y="586" font-size="44" font-weight="900">100%</text><text x="1530" y="625" font-size="20" font-weight="600" opacity=".9">tự nhiên · đạt chuẩn</text></g></g>
<!-- curl -->
<path d="M1900 550 L1620 830 C1700 790 1820 730 1960 610 C1975 580 1940 552 1900 550 Z" fill="url(#curl)" filter="url(#sh2)"/>
<path d="M1622 828 C1700 788 1820 728 1956 612" stroke="#9fb0a7" stroke-width="3" fill="none" opacity=".6"/>
<!-- stickers -->
<g filter="url(#sh2)" transform="translate(1290 420) rotate(-12)"><path d="M0 -120 l28 50 l57 -12 l-10 57 l50 28 l-50 28 l10 57 l-57 -12 l-28 50 l-28 -50 l-57 12 l10 -57 l-50 -28 l50 -28 l-10 -57 l57 12 z" fill="#a8264f"/><text x="0" y="12" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900" fill="#fff" text-anchor="middle">99,9%</text><text x="0" y="48" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffd8e3" text-anchor="middle">DIỆT KHUẨN</text></g>
<g filter="url(#sh2)" transform="translate(2120 330) rotate(10)"><circle r="118" fill="#f2cf3b"/><circle r="100" fill="none" stroke="#8a6322" stroke-width="4" stroke-dasharray="10 8"/><text y="-8" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#5c4321" text-anchor="middle">9/10</text><text y="34" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#5c4321" text-anchor="middle">NHA SĨ</text><text y="58" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#5c4321" text-anchor="middle">KHUYÊN DÙNG</text></g>
<g filter="url(#sh2)" transform="translate(2150 640) rotate(-8)"><rect x="-120" y="-56" width="240" height="112" rx="12" fill="#fbf8f1" stroke="#3d7ea6" stroke-width="6"/><text y="-6" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="900" fill="#3d7ea6" text-anchor="middle">"FDA"</text><text y="32" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#3d7ea6" text-anchor="middle">ĐẠT CHUẨN?</text></g>
<g filter="url(#sh2)" transform="translate(1250 700) rotate(6)"><rect x="-110" y="-44" width="220" height="88" rx="44" fill="#0b1712"/><text y="12" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#d7f25c" text-anchor="middle">KIỂM NGHIỆM</text></g>
<!-- magnifier -->
<g filter="url(#sh)" transform="translate(1805 785) rotate(-40)"><rect x="-22" y="135" width="44" height="200" rx="22" fill="#3b2f22"/><rect x="-28" y="115" width="56" height="40" rx="10" fill="#c8963e"/><circle r="135" fill="url(#glass)" stroke="#0b1712" stroke-width="26"/><path d="M-80 -55 a100 100 0 0 1 60 -62" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round" opacity=".8"/></g>
</svg>
